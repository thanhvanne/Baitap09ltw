<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title>Products</title>
</head>

<body>

<main
    class="container"
    layout:fragment="content">

    <div class="page-title">

        <h1>Sản phẩm</h1>

        <a
            class="btn primary"
            th:href="@{/products/new}">
            Thêm sản phẩm
        </a>

    </div>

    <form
        class="search"
        method="get">

        <input
            name="keyword"
            th:value="${keyword}"
            placeholder="Tên sản phẩm">

        <button class="btn primary">
            Tìm
        </button>

    </form>

    <div class="table-wrap">

        <table>

            <tr>
                <th>Ảnh</th>
                <th>Tên</th>
                <th>Giá</th>
                <th>Chủ sở hữu</th>
                <th>Thao tác</th>
            </tr>

            <tr th:each="p : ${products.content}">

                <td>
                    <img
                        th:if="${p.image != null}"
                        class="thumb"
                        th:src="${p.image}">
                </td>

                <td th:text="${p.name}"></td>

                <td th:text="${p.price}"></td>

                <td th:text="${p.ownerName}"></td>

                <td>

                    <a
                        class="btn secondary small"
                        th:href="@{/products/edit/{id}(id=${p.id})}">
                        Sửa
                    </a>

                    <form
                        th:action="@{/products/delete/{id}(id=${p.id})}"
                        method="post"
                        style="display:inline">

                        <button
                            class="btn danger small">
                            Xóa
                        </button>

                    </form>

                </td>

            </tr>

        </table>

    </div>

    <div class="pagination">

        <a th:if="${products.hasPrevious()}"
           th:href="@{/products(page=${products.number-1},keyword=${keyword})}">
            Trước
        </a>

        <span>
            Trang
            <span th:text="${products.number+1}"></span>
            /
            <span th:text="${products.totalPages}"></span>
        </span>

        <a th:if="${products.hasNext()}"
           th:href="@{/products(page=${products.number+1},keyword=${keyword})}">
            Sau
        </a>

    </div>

</main>

</body>
</html>
