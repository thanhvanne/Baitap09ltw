<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title th:text="${product.id == null
        ? 'Thêm sản phẩm'
        : 'Sửa sản phẩm'}">
        Sản phẩm
    </title>
</head>

<body>

<main class="container narrow"
      layout:fragment="content">

    <div class="panel">

        <h1 th:text="${product.id == null
            ? 'Thêm sản phẩm'
            : 'Sửa sản phẩm'}">
            Sản phẩm
        </h1>

        <div class="alert error"
             th:if="${error}"
             th:text="${error}">
        </div>

        <form class="form-grid"
              th:action="@{/products/save}"
              th:object="${product}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   th:field="*{id}">

            <label>Tên sản phẩm</label>

            <div>
                <input type="text"
                       th:field="*{name}"
                       maxlength="200">

                <small class="field-error"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}">
                </small>
            </div>

            <label>Mô tả</label>

            <div>
                <textarea th:field="*{description}"
                          rows="5"
                          maxlength="1000">
                </textarea>

                <small class="field-error"
                       th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}">
                </small>
            </div>

            <label>Giá</label>

            <div>
                <input type="number"
                       step="0.01"
                       min="0"
                       th:field="*{price}">

                <small class="field-error"
                       th:if="${#fields.hasErrors('price')}"
                       th:errors="*{price}">
                </small>
            </div>

            <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

                <label>Chủ sở hữu</label>

                <select th:field="*{userId}"
                        required>

                    <option value="">
                        -- Chọn User --
                    </option>

                    <option th:each="u : ${users}"
                            th:value="${u.id}"
                            th:text="${u.fullName
                                + ' (' + u.username + ')'}">
                    </option>

                </select>

            </th:block>

            <th:block th:if="${#authorization.expression('hasRole(''USER'')')}">

                <label>Chủ sở hữu</label>

                <div>
                    <strong th:text="${#authentication.principal.fullName}">
                        User
                    </strong>

                    <span th:text="'('
                        + ${#authentication.principal.username}
                        + ')'">
                    </span>
                </div>

            </th:block>

            <th:block th:if="${product.image != null
                and !#strings.isEmpty(product.image)}">

                <label>Ảnh hiện tại</label>

                <div>
                    <img class="preview"
                         th:src="${product.image}"
                         alt="Product">
                </div>

            </th:block>

            <label>Ảnh mới</label>

            <div>
                <input type="file"
                       name="file"
                       accept="image/*">

                <small>
                    Để trống nếu muốn giữ ảnh hiện tại.
                </small>
            </div>

            <div>

                <button class="btn primary"
                        type="submit">
                    Lưu
                </button>

                <a class="btn secondary"
                   th:href="@{/products}">
                    Hủy
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
