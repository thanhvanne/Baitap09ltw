<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title>Quản lý người dùng</title>
</head>

<body>

<main class="container"
      layout:fragment="content">

    <div class="page-title">

        <div>
            <h1>Quản lý người dùng</h1>
            <p>Danh sách tài khoản trong hệ thống</p>
        </div>

        <a class="btn primary"
           th:href="@{/users/new}">
            + Thêm User
        </a>

    </div>

    <div class="alert success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <div class="alert error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form class="search"
          method="get"
          th:action="@{/users}">

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Tìm username, email hoặc họ tên">

        <button class="btn primary"
                type="submit">
            Tìm kiếm
        </button>

        <a class="btn secondary"
           th:if="${keyword != null and !#strings.isEmpty(keyword)}"
           th:href="@{/users}">
            Xóa tìm kiếm
        </a>

    </form>

    <div class="table-wrap">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Ảnh</th>
                <th>Username</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Vai trò</th>
                <th>Sản phẩm</th>
                <th>Trạng thái</th>
                <th>Ngày tạo</th>
                <th>Thao tác</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="u : ${users.content}">

                <td th:text="${u.id}"></td>

                <td>

                    <img th:if="${u.images != null
                                and !#strings.isEmpty(u.images)}"
                         class="thumb"
                         th:src="${u.images}"
                         alt="Avatar">

                    <span th:unless="${u.images != null
                                    and !#strings.isEmpty(u.images)}">
                        Không có ảnh
                    </span>

                </td>

                <td th:text="${u.username}"></td>

                <td th:text="${u.fullName}"></td>

                <td th:text="${u.email}"></td>

                <td th:text="${u.roleName}"></td>

                <td th:text="${u.productCount}"></td>

                <td>

                    <span th:if="${u.enabled}"
                          class="status active">
                        Hoạt động
                    </span>

                    <span th:unless="${u.enabled}"
                          class="status inactive">
                        Đã khóa
                    </span>

                </td>

                <td th:text="${u.createdAt != null
                    ? #temporals.format(
                        u.createdAt,
                        'dd/MM/yyyy HH:mm'
                    )
                    : ''}">
                </td>

                <td class="actions">

                    <a class="btn secondary small"
                       th:href="@{/users/edit/{id}(id=${u.id})}">
                        Sửa
                    </a>

                    <form th:action="@{/users/delete/{id}(id=${u.id})}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <button class="btn danger small"
                                type="submit"
                                onclick="return confirm('Bạn có chắc muốn xóa người dùng này?')">
                            Xóa
                        </button>

                    </form>

                </td>

            </tr>

            <tr th:if="${users.content.isEmpty()}">

                <td colspan="10"
                    class="empty">
                    Không có người dùng.
                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <div class="pagination"
         th:if="${users.totalPages > 1}">

        <a th:if="${users.hasPrevious()}"
           th:href="@{/users(
               page=${users.number - 1},
               keyword=${keyword}
           )}">
            Trước
        </a>

        <span>
            Trang
            <strong th:text="${users.number + 1}"></strong>
            /
            <strong th:text="${users.totalPages}"></strong>
        </span>

        <a th:if="${users.hasNext()}"
           th:href="@{/users(
               page=${users.number + 1},
               keyword=${keyword}
           )}">
            Sau
        </a>

    </div>

</main>

</body>
</html>
