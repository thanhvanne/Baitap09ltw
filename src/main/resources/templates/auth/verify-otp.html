<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Xác thực OTP</title>
    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body class="auth-page">

<div class="auth-card">

    <h1>Xác thực OTP</h1>

    <p>
        OTP đã được gửi đến
        <strong th:text="${email}"></strong>.
    </p>

    <div class="alert success"
         th:if="${param.resent}">
        Đã gửi lại OTP.
    </div>

    <div class="alert error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/verify-otp}"
          method="post">

        <input type="hidden"
               name="email"
               th:value="${email}">

        <label>OTP 6 chữ số</label>

        <input name="otp"
               maxlength="6"
               pattern="[0-9]{6}"
               inputmode="numeric"
               autocomplete="one-time-code"
               required>

        <button class="btn primary full"
                type="submit">
            Xác nhận
        </button>

    </form>

    <form th:action="@{/register/resend-otp}"
          method="post"
          class="mt">

        <input type="hidden"
               name="email"
               th:value="${email}">

        <button class="btn secondary full"
                type="submit">
            Gửi lại OTP
        </button>

    </form>

    <p>
        <a th:href="@{/login}">
            Quay lại đăng nhập
        </a>
    </p>

</div>

</body>
</html>
