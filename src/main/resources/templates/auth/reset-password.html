<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body class="auth-page">

<div class="auth-card">

    <h1>Đổi mật khẩu</h1>

    <div class="alert error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/reset-password}"
          th:object="${resetDTO}"
          method="post">

        <input type="hidden"
               th:field="*{email}">

        <label>OTP</label>

        <input th:field="*{otp}"
               maxlength="6"
               pattern="[0-9]{6}"
               inputmode="numeric"
               required>

        <small class="field-error"
               th:errors="*{otp}">
        </small>

        <label>Mật khẩu mới</label>

        <input type="password"
               th:field="*{password}"
               required>

        <small class="field-error"
               th:errors="*{password}">
        </small>

        <label>Xác nhận mật khẩu</label>

        <input type="password"
               th:field="*{confirmPassword}"
               required>

        <small class="field-error"
               th:errors="*{confirmPassword}">
        </small>

        <button class="btn primary full"
                type="submit">
            Đổi mật khẩu
        </button>

    </form>

    <p>
        <a th:href="@{/login}">
            Quay lại đăng nhập
        </a>
    </p>

</div>

</body>
</html>
