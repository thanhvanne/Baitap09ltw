<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header"
        class="topbar">

    <div class="brand">

        <a th:href="@{/}">
            IOTSTAR SHOP
        </a>

    </div>

    <nav>

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/products}">
            Products
        </a>

        <a th:href="@{/users}"
           th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            Users
        </a>

        <a th:href="@{/dashboard}"
           th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            Dashboard
        </a>

    </nav>

    <div class="account"
         th:if="${#authorization.expression('isAuthenticated()')}">

        <img
            class="avatar"
            th:src="${#authentication.principal.images != null
                 and !#strings.isEmpty(#authentication.principal.images)
                 ? #authentication.principal.images
                 : '/images/avatar-default.svg'}"
            alt="Avatar">

        <span
            th:text="${#authentication.principal.fullName}">
            User
        </span>

        <span
            th:text="'(' + ${#authentication.principal.username} + ')'">
        </span>

        <form
            th:action="@{/logout}"
            method="post">

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <button
                class="link-button"
                type="submit">

                Đăng xuất

            </button>

        </form>

    </div>

    <a th:unless="${#authorization.expression('isAuthenticated()')}"
       th:href="@{/login}">
        Đăng nhập
    </a>

</header>

</body>
</html>
